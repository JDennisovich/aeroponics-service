spring.application.name=Aeroponics

spring.datasource.url=jdbc:mysql://localhost:3306/aeroponics
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# jwt oauth2 properties
## expiry-at value in minutes
jwt.core.expiry-at=30
## refresh-expiry-at value in hours
jwt.core.refresh-expiry-at=24
jwt.core.issuer=Aeroponics

# Logging Config
#logging.config=classpath:logback-spring.xml

## Base log file name and location
logging.file.name=/var/log/aeroponics/Aeroponics.log

## Rolling file configuration
logging.logback.rollingpolicy.file-name-pattern=/var/log/aeroponics/rolling/security-test.%d{yyyy-MM-dd}.%i.gz.log
logging.logback.rollingpolicy.max-file-size=30MB
logging.logback.rollingpolicy.total-size-cap=1GB

# jwt oauth2 rsa key properties
jwt.rsa.private-key=classpath:private_key.pem
jwt.rsa.public-key=classpath:public_key.pem

# file properties
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
file.home.directory=${user.home}
file.image.directory=${FILE_IMAGE_DIR:${user.home}/aeroponics/images/}
file.image.url=${FILE_IMAGE_URL:http://localhost:${server.port:8080}/resources/}

# image properties
IMAGE_URL=${file.image.url}image/
IMAGE_DIR=${file.image.directory}

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
