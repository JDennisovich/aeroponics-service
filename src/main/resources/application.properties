spring.application.name=Aeroponics

# Local MySQL (development) - keep commented
#spring.datasource.url=jdbc:mysql://localhost:3306/aeroponics
#spring.datasource.username=root
#spring.datasource.password=

# Production/Remote - values loaded from environment variables (see .env)
# Supports multiple env var names: DB_URL/MYSQL_URL, DB_USERNAME/MYSQLUSER/MYSQL_USER, DB_PASSWORD/MYSQLPASSWORD/MYSQL_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}
spring.jpa.properties.hibernate.format_sql=true

# jwt oauth2 properties
## expiry-at value in minutes
jwt.core.expiry-at=30
## refresh-expiry-at value in hours
jwt.core.refresh-exp-at=24
jwt.core.issuer=Aeroponics

# Logging Config
#logging.config=classpath:logback-spring.xml

## Base log file name and location
logging.file.name=/var/log/aeroponics/Aeroponics.log

## Rolling file configuration
logging.logback.rollingpolicy.file-name-pattern=/var/log/aeroponics/rolling/security-test.%d{yyyy-MM-dd}.%i.gz.log
logging.logback.rollingpolicy.max-file-size=30MB
logging.logback.rollingpolicy.total-size-cap=1GB

# jwt oauth2 rsa key properties
jwt.rsa.private-key=classpath:private_key.pem
jwt.rsa.public-key=classpath:public_key.pem

# file properties
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
file.home.directory=${user.home}
file.image.directory=${FILE_IMAGE_DIR:${user.home}/aeroponics/images/}
file.image.url=${FILE_IMAGE_URL:http://localhost:${server.port:8080}/resources/}

# image properties
IMAGE_URL=${file.image.url}image/
IMAGE_DIR=${file.image.directory}

# Email configuration - SendGrid SMTP Integration
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false

# SendGrid configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}

# Cloudinary configuration (Option 2 - set these for local development/testing)
# Replace the placeholder values below with your Cloudinary credentials.
# Note: storing secrets in this file is convenient for development but not recommended for production.
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${CLOUD_KEY}
cloudinary.api_secret=${CLOUD_SECRET}
# Optional: folder to store uploads within your Cloudinary account (e.g. "aeroponics/users")
cloudinary.upload_folder=${CLOUD_FOLDER}

# End Cloudinary configuration
